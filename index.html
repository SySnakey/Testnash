<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nash HU Push/Fold (20BB cap)</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #fff; margin: 0; padding: 20px; }
        h1 { margin-bottom: 5px; font-size: 24px; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 40px; page-break-inside: avoid; }
        .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; width: 100%; max-width: 800px; background: #333; border: 2px solid #333; }
        .cell { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; background: #f0f0f0; border-radius: 2px; color: #111; }
        .cell span { font-size: 10px; font-weight: normal; color: #444; margin-top: 2px; }
        
        /* Culori inspirate din softurile de GTO */
        .pair { background-color: #a3d9a5; } /* Verde - Perechi */
        .suited { background-color: #a3c4f3; } /* Albastru - Suited */
        .offsuit { background-color: #f7d794; } /* Galben/Portocaliu - Offsuit */
        .fold { background-color: #e0e0e0; color: #888; } /* Gri - Fold 100% / valori f mici */
        
        @media print {
            body { padding: 0; }
            .container { gap: 20px; }
            h1 { font-size: 20px; }
            .grid { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h1>NASH PUSH (Max BB to Push)</h1>
        <div class="grid" id="pushGrid"></div>
    </div>
    
    <div>
        <h1>NASH CALL (Max BB to Call)</h1>
        <div class="grid" id="callGrid"></div>
    </div>
</div>

    function createGrid(gridId, valuesObj) {
        const grid = document.getElementById(gridId);
        for (let r = 0; r < 13; r++) {
            for (let c = 0; c < 13; c++) {
                const cell = document.createElement('div');
                let hand = ranks[r] + ranks[c];
                let type = '';

                if (r === c) {
                    type = 'pair';
                } else if (r < c) {
                    hand = ranks[r] + ranks[c] + 's';
                    type = 'suited';
                } else {
                    hand = ranks[c] + ranks[r] + 'o';
                    type = 'offsuit';
                }

                let value = valuesObj[hand] || '-';
                
                // Opțional: dacă valoarea e f mică sau fold (ex: sub 1.1 BB pt Call), o putem face gri
                if (value === '-' || parseFloat(value) < 1.1) {
                    cell.className = `cell fold`;
                } else {
                    cell.className = `cell ${type}`;
                }

                cell.innerHTML = `${hand}<br><span>${value}</span>`;
                grid.appendChild(cell);
            }
        }
    }

    createGrid('pushGrid', pushValues);
    createGrid('callGrid', callValues);

</html>
